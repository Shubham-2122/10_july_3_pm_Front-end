<body>

    <!-- hide :- abscr , private access :- encu  -->

    <script>

        function person(name,age){

            // abscr
            let _name = name;
            let _age = age;

            // method:- encu
            this.getName=()=>{
                return _name;
            }

            this.getAge=()=>{
                return _age;
            }

            this.setAge=(newAge)=>{
                return _age = newAge;
            }
        }

        const user = new person("keyur",24)
        console.log(user)
        console.log(user._name)
        console.log(user._age)

        console.log(user.getName())
        console.log(user.getAge())
        user.setAge(25)

        console.log(user.getAge())
        

    </script>

    </script>
