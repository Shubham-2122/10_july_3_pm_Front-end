<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- call :- two object combine sprate argument -->

    <script>

        let data = {
            fullname : function display(city,state){
                console.log("Fname =>",this.fname , " lname =>",this.lname," city =>",city," state =>",state )
            }
        }

        let person = {
            fname : "het",
            lname : "patel"
        }

        let person1 = {
            fname : "varj",
            lname : "parmar"
        }

        // call method sprate argument
        data.fullname.call(person,"surat","gujarat")

        // apply method , as array argument
        data.fullname.apply(person1,["rajkot","gujarat"])

    </script>
</body>
</html>
