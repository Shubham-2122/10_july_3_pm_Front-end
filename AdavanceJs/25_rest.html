<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- ... rest , ... spred :- value store  -->


    <!-- function parameter store ... rest  -->


    <script>
        function test(...mahi){
            let sum = 0
            for(let data in mahi){
                sum = sum + mahi[data]
            }
            return sum
        }

        console.log(test(40,30,60,70,30))
    </script>

</body>
