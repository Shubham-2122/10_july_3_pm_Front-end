<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    
</head>

<body>

    <div class="container">
        <div class="progress">
            <div class="progress-bar" style="width:70%"></div>
        </div>
         <div class="progress">
            <div class="progress-bar bg-info" style="width:60%">60%</div>
        </div>
         <div class="progress">
            <div class="progress-bar bg-success" style="width:85%">85%</div>
        </div>
         <div class="progress" style="height: 40px;">
            <div class="progress-bar bg-dark" style="width:70%"></div>
        </div>


         <div class="progress">
            <div class="progress-bar progress-bar-striped" style="width:70%"></div>
        </div>
         <div class="progress">
            <div class="progress-bar bg-info progress-bar-striped" style="width:60%">60%</div>
        </div>
         <div class="progress">
            <div class="progress-bar bg-success progress-bar-striped" style="width:85%">85%</div>
        </div>
         <div class="progress" style="height: 40px;">
            <div class="progress-bar bg-dark progress-bar-striped" style="width:70%"></div>
        </div>


         <div class="progress">
            <div class="progress-bar progress-bar-striped progress-bar-animated" style="width:70%"></div>
        </div>
         <div class="progress">
            <div class="progress-bar bg-info progress-bar-striped progress-bar-animated" style="width:60%">60%</div>
        </div>
         <div class="progress">
            <div class="progress-bar bg-success progress-bar-striped progress-bar-animated" style="width:85%">85%</div>
        </div>
         <div class="progress" style="height: 40px;">
            <div class="progress-bar bg-dark progress-bar-striped progress-bar-animated" style="width:70%"></div>
        </div>
    </div>

</body>

</html>
