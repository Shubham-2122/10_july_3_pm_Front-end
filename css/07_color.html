<body>
    <h1 style="color: blue;">Hello this background-color normal</h1>

    <h1 style="color: #7adc2f;">Hello this background-color hexa #000</h1>

    <!--rgb (0,0,0) 0 -255 -->

    <h1 style="color: rgb(25, 7, 224);">Hello this background-color rgb</h1>

    <!-- hsl -->

    <h1 style="color: hsl(154, 44%, 32%);">Hello this hsl color</h1>
     <h1 style="color: hsla(207, 44%, 32%, 0.769);">Hello this hsl color</h1>
