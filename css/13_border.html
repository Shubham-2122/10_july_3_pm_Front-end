<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main {
            height: 200px;
            width: 200px;
            border: 2px solid;
        }
    </style>
</head>

<body>
    <!-- width style color -->
    <h1 style="border: 2px solid red;">border</h1>

    <h1 style="border-width: 5px;border-style: solid;border-color: aqua;">border witdh and style color</h1>
    <h1 style="border: 5px solid green;">Border style</h1>
    <h1 style="border: 5px dotted green;">Border style</h1>
    <h1 style="border: 5px dashed green;">Border style</h1>
    <h1 style="border: 5px double green;">Border style</h1>
    <h1 style="border: 5px ridge green;">Border style</h1>
    <h1 style="border: 5px solid green;border-style: groove;">Border style</h1>
    <h1 style="border: 5px solid green;border-style: outset;">Border style</h1>
    <h1 style="border: 5px solid green;border-style: inset;">Border style</h1>


    <h1 style="border-top: 5px solid yellow;">Border top</h1>
    <h1 style="border-bottom: 5px solid yellow;">Border top</h1>
    <h1 style="border-left: 5px solid yellow;">Border top</h1>
    <h1 style="border-right: 5px solid yellow;">Border top</h1>

    <div class="main">

    </div>
    <div class="main">

    </div>
</body>

</html>
