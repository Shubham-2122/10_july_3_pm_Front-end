<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul li:first-child{
            background-color: red;
        }
        ul li:last-child{
            background-color: aqua;
        }
        ul li:nth-child(3){
            background-color: lightgreen;
        }
        ul li:nth-last-child(1){
            background-color: blue;
        }
        ul li:nth-child(even){
            background-color: red;
        }
        ul li:nth-child(odd){
            background: green;
        }
        .main{
            height: 200px;
            width: 200px;
            border: 2px solid;
             transition: 1s;
             
        }
        .main:hover{
            background-color: lightcoral;
            border-radius: 50px;
            transform: translateX(50px);
           
        }

        input{
            margin-top: 50px;
            border: none;
        }
        input:focus{
            background-color:lightcoral;
            border: 2px solid green;
            outline: 5px solid green;
        }
    </style>
</head>
<body>
    <!-- psudeo class (:) -->
    <!-- psudeo element (::) -->
    <ul>
        <li>One</li>
        <li>two</li>
        <li>three</li>
        <li>four</li>
        <li>five</li>
        <li>six</li>
        <li>seven</li>
        <li>eight</li>
    </ul>

    <div class="main">

    </div>

    <input type="text" placeholder="Enter your name">

</body>

</html>
