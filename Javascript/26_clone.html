<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- <input type="text" id="inp" onkeypress="clonedata()" placeholder="Enter your data"> -->
         <input type="text" id="inp" onkeyup="clonedata()" placeholder="Enter your data">
    <textarea name="" id="text" rows="10" cols="30"></textarea>

    <button onclick="clonedata()">Add data</button>

    <script>

        let inp =document.getElementById("inp")
        let text_data = document.getElementById("text")

        function clonedata(){
            text_data.innerHTML = inp.value
        }

    </script>


</body>
</html>
