<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- syncro  -->

    <script>
        // syncro javascript :- code line by line 

        console.log(1)
        console.log(2)
        console.log(3)
        console.log(4)
        console.log(5)


        // asyncro javscript :- hold code 
        console.log(5)
        console.log(6)
        console.log(7)
        setTimeout(function(){
            console.log(8)
        },2000)
        console.log(9)
        console.log(10)
    </script>
</body>
</html>
