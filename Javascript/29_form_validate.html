<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="">
        <div>
            <input type="text" onblur="return validation(nm,nmerr)" placeholder="Enter your name" id="nm">
            <span id="nmerr"></span>
        </div>
        <div>
            <input type="email" onblur="return validation(em,emerrs)" id="em" placeholder="Enter your Email">
            <span id="emerrs"></span>
        </div>
        <div>
            <input type="tel" id="mb" onblur="return validation(mb,mberr)" placeholder="Enter your Phone">
            <span id="mberr"></span>
        </div>
        <div>
            <input type="password" id="psw" onblur="return validation(psw,pswerr)"  placeholder="Enter your password">
            <span id="pswerr"></span>
        </div>
        <div>
            <input type="submit" >
        </div>
    </form>

    <script>
       
        function validation(inp,err){

            if(inp.value == "" || inp.value == null){
                err.innerHTML = "pls filed required..!";
                err.style.color = "red";
                inp.style.border = "2px solid red"
                return false
            }
            else{
                err.innerHTML = "";
                inp.style.border = "2px solid green"
                return false
            }
        }

    </script>

</body>

</html>
