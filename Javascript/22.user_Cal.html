<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="num1"  placeholder="Enter your num1">
    <input type="text" id="num2" placeholder="Enter your num2"><br> <br>
    <button onclick="sum()">SUM</button>
    <button onclick="sub()">Sub</button>
    <button onclick="mul()">Mul</button>
    <button onclick="divi()">Divi</button>

    <h1 id="h1"></h1>

    <script>

        let num1 = document.getElementById("num1")
        console.log(num1)
        let num2 = document.getElementById("num2")
        console.log(num2)

        function sum(){
            let sum
             sum = parseFloat(num1.value) + parseFloat(num2.value)
            console.log(sum)
            document.getElementById("h1").innerHTML = "sum =>"+sum;
        }

        function sub(){
            let sub = parseFloat(num1.value) - parseFloat(num2.value)
            document.getElementById("h1").innerHTML = `sub => ${sub}`
        }
          function mul(){
            let sub = parseFloat(num1.value) * parseFloat(num2.value)
            document.getElementById("h1").innerHTML = `mul => ${sub}`
        }

         function divi(){
            let sub = parseFloat(num1.value) / parseFloat(num2.value)
            document.getElementById("h1").innerHTML = `mul => ${sub}`
        }

    </script>
</body>
</html>
