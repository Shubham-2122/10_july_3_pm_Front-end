<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let choic = "*";
        let a =30,b=20;

        switch (choic) {
            case "+":
                console.log("sum =>",a+b)
                break;
            case "-":
                console.log("sub =>",a-b);
                break
            case "*":
                console.log("mul =>",a*b)
                break;

            default:
                console.log("invalid symbols")
                break;
        }
    </script>
</body>
</html>
