<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="h1">Hello this data</h1>
    <button onclick="addData()">add css</button>

    <script>

        let h1_tag = document.getElementById("h1")
        console.log(h1_tag)

        function addData(){
            h1_tag.innerText ="hello h1 data";
            h1_tag.style.background = "blue";
            h1_tag.style.color = "white";
            h1_tag.style.fontSize = "40px";
            h1_tag.style.padding = "30px"
        }

    </script>
</body>
</html>
