<body>
    <script>
        //If statement
        let age = 16;

        if(age>=18){
            console.log("You are adult")
        }else{
            console.log("You are minor")
        }

        //Ladder if else
        let marks = 90;

        if (marks>=100 || marks<=0){
            console.log("Marks is High or Low")
        }else if (marks >= 75 && marks <=89){
            console.log("Grade B")
        }
        else if (marks>=90 || marks<=100){
            console.log("Grade A")
        }
        else{
            console.log("Failll")
        }

        //nasted If else 
        let a = 26;
        let b = 18 ;
        if (a>=18){
            if(b>=18){
                console.log("You are Minor")
            }
            else{
                console.log("You are Adult")
            }
        }
    </script>
